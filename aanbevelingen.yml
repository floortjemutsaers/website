- naam: Reinier Etienne
  omschrijving: Erasmus MC, product owner publieke website, klant (2022)
  tekst: Als product owner van de publieke website van het Erasmus MC heb ik zo'n 3 jaar heel prettig samengewerkt met Floor, die senior project coördinator was. Maar eigenlijk ook product owner, scrum master en accountmanager... Ze zorgde altijd voor een goede open communicatie met ons als klant, ontzorgde mij door alle overleggen goed in te plannen, voor te bereiden en afspraken na afloop vast te leggen. Ze zat er altijd bovenop dat iedereen zijn afspraken nakwam en dat haar team optimaal werd ingezet voor ons als klant. Ze bewaakte de budgetten goed en zorgde voor duidelijkheid over en inzicht in de kosten. Ook keek ze inhoudelijk kritisch mee naar waar we in de sprints mee bezig waren, kwam ze met suggesties en testte ze mee waar nodig. Floor is niet alleen gestructureerd en betrouwbaar in haar werk, ze is ook een sociaal en gezellig persoon om mee samen te werken.
  soort: Klant of collega
  project: io
  breed: true
- naam: Anne Broekhuizen
  omschrijving: Erasmus MC, klant (2020)
  tekst: Floor is een heel fijn persoon om mee te werken. Ze is heel relaxt, maar overziet alles goed. Ze heeft een goed beeld van wat er speelt, hoe een project loopt en wanneer ze moet bijsturen. Floor reageert altijd snel op vragen, maar ook op situaties die daarom vragen. Ze kan snel schakelen en zorgt ervoor dat de leden in het (project)team de neuzen dezelfde kant op hebben. Dit doet ze altijd met een lach.
  soort: Klant of collega
  project: io
  breed: false
