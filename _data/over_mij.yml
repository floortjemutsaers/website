kop: "Niet bang om dingen uit te proberen "
intro: "Ik ben allround docent bij Fontys SPECO Sportmarketing. Mijn overstap
  van het bedrijfsleven naar het onderwijs is het bewijs dat ik niet bang ben om
  dingen uit te proberen, en deze website ook: die bouwde ik zelf met AI, ter
  vervanging van mijn oude WordPress-site."
tekst: >-
  **Online marketing is mijn specialisme.** Ik ken het vak uit meer dan tien
  jaar praktijk aan beide kanten van de tafel: als leverancier bij de digitale
  bureaus Indicia en IO, en intern op de marketingafdeling van Sacha en
  Manfield. Ik blijf vernieuwen en experimenteer volop met AI.


  Bij SPECO werk ik actief mee aan het nieuwe curriculum en geef ik lessen en
  projectbegeleiding in (online) marketing, communicatie en
  presentatievaardigheden. Als allround docent heb ik in alle jaarlagen
  lesgegeven. Dit jaar sta ik in het eerste jaar als docent en coach, en ben ik
  doorstroomcoördinator binnen de opleiding.
krachten_titel: Mijn krachten
krachten_intro: Hoe ik werk, in de klas, in een projectteam en met klanten.
krachten_foto: /portret.jpg
krachten:
  - titel: Presenteren
    tekst: Voor een groep staan voelt als thuiskomen, of het nu een klas eerstejaars
      is, een stuurgroep bij een klant of een zaal vol vakgenoten.
  - titel: Coachen
    tekst: Ik stel de vragen die mensen verder helpen. Studenten en collega's leren
      bij mij reflecteren op zichzelf en op elkaar, en groeien inhoudelijk én
      persoonlijk.
  - titel: Stevig in mijn schoenen
    tekst: Duidelijke afspraken, heldere kaders en een flinke dosis humor. Zo krijg
      ik zowel een volle klas als een klant met veel stakeholders mee.
  - titel: Teamplayer
    tekst: Het groepsbelang gaat voor mijn eigen belang. Ik geef eerlijke feedback
      en vraag er net zo makkelijk om.
  - titel: Plannen
    tekst: Meer dan tien jaar sprints, deadlines en opleveringen hebben me geleerd
      overzicht te houden. Ik ben altijd voorbereid, en vaak als eerste klaar
      met nakijken.
  - titel: Vernieuwend
    tekst: Ik bewandel niet altijd de gebaande paden, ben sterk in omdenken en
      probeer graag nieuwe tools uit. Deze website is daar een voorbeeld van.
sport_titel: Sport hoort bij mij
sport_intro: Bij SPECO Sportmarketing komen sport en marketing samen. Die
  combinatie herken ik ook in mezelf.
sport:
  - titel: 15 jaar sportdocent
    tekst: Van 2011 tot 2026 gaf ik als invaldocent sportlessen aan groepen van 10
      tot 60 studenten van Tilburg University. Een zaal vol mensen enthousiast
      houden is ook communicatie.
  - titel: Elke week op de skeelers
    tekst: Daarnaast af en toe een balletje tennis, en heel soms paardrijden in de
      duinen.
  - titel: De bergen in
    tekst: Ik ga graag op wintersport. Met twee kleintjes is elk jaar gaan wel een
      uitdaging, maar we doen ons best.
prive_titel: "Thuis en op het werk: dezelfde energie"
prive_tekst: >-
  Ik ben moeder, met een zoontje en een dochtertje thuis. Mijn gezin maakt me
  niet minder ambitieus, maar scherper. Ik weet wat ik wil, plan strak en haal
  eruit wat erin zit, op het werk en thuis.


  Mijn nieuwsgierigheid nam me mee naar Thailand, Mauritius, Brazilië, Sri
  Lanka, New York en Cuba. Tegenwoordig reizen we dichter bij huis: naar de
  sneeuw, de kust of Zuid-Frankrijk. Ik ben sociaal, praat graag en haal energie
  uit mensen om me heen, uit vriendinnen, collega's en studenten.
