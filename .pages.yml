# Instellingen voor het CMS (Pages CMS). Dit bepaalt welke invulvelden je ziet.
media:
  input: images
  output: /images

content:
  - name: algemeen
    label: Algemeen (naam, functie, contact)
    type: file
    path: _data/algemeen.yml
    fields:
      - { name: voornaam, label: Voornaam, type: string }
      - { name: achternaam, label: Achternaam, type: string }
      - { name: pitch, label: Korte introductie bovenaan de homepage, type: text }
      - { name: functie, label: Functie (vetgedrukt), type: string }
      - { name: functie_bij, label: Waar (achter je functie), type: string }
      - { name: extra_regel, label: Extra regel onder je functie, type: string }
      - { name: linkedin, label: Link naar je LinkedIn, type: string }
      - { name: email, label: "E-mailadres (leeg laten = geen e-mailknop)", type: string }
      - { name: contact_titel, label: Kop van het contactblok, type: string }
      - { name: contact_tekst, label: Tekst van het contactblok, type: text }
      - { name: contact_foto, label: Ronde foto bij contact, type: image }
      - { name: google_omschrijving, label: Omschrijving voor Google en LinkedIn, type: text }

  - name: home
    label: Homepage
    type: file
    path: _data/home.yml
    fields:
      - { name: foto, label: Grote foto bovenaan, type: image }
      - { name: foto_omschrijving, label: Omschrijving van de foto, type: string }
      - { name: carrousel_intro, label: Zin boven de logo-carrousel, type: text }
      - { name: intro_titel, label: Kop introductie, type: string }
      - { name: intro_tekst, label: "Tekst introductie (**woorden** = vetgedrukt)", type: text }
      - { name: werk_titel, label: Kop uitgelicht werk, type: string }
      - { name: werk_intro, label: Tekst onder kop uitgelicht werk, type: text }
      - { name: expertise_titel, label: Kop expertise, type: string }
      - { name: expertise_intro, label: Tekst onder kop expertise, type: text }
      - name: expertise
        label: Expertise-blokken
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.titel}" } }
        fields:
          - { name: titel, label: Titel, type: string }
          - { name: tekst, label: Tekst, type: text }
      - { name: aanbevelingen_titel, label: Kop aanbevelingen-slider, type: string }

  - name: over_mij
    label: Over mij
    type: file
    path: _data/over_mij.yml
    fields:
      - { name: kop, label: Grote kop, type: string }
      - { name: intro, label: Introductie onder de kop, type: text }
      - { name: tekst, label: "Tekst (lege regel = nieuwe alinea, **woorden** = vet)", type: text }
      - { name: krachten_titel, label: Kop krachten, type: string }
      - { name: krachten_intro, label: Tekst onder kop krachten, type: text }
      - { name: krachten_foto, label: Foto bij krachten, type: image }
      - name: krachten
        label: Krachten
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.titel}" } }
        fields:
          - { name: titel, label: Titel, type: string }
          - { name: tekst, label: Tekst, type: text }
      - { name: sport_titel, label: Kop sport, type: string }
      - { name: sport_intro, label: Tekst onder kop sport, type: text }
      - name: sport
        label: Sportblokken
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.titel}" } }
        fields:
          - { name: titel, label: Titel, type: string }
          - { name: tekst, label: Tekst, type: text }
      - { name: prive_titel, label: Kop privé, type: string }
      - { name: prive_tekst, label: "Tekst privé (lege regel = nieuwe alinea)", type: text }
      - name: prive_fotos
        label: Privéfoto's
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.bijschrift}" } }
        fields:
          - { name: foto, label: Foto, type: image }
          - { name: bijschrift, label: Bijschrift, type: string }
          - { name: omschrijving, label: Omschrijving (voor schermlezers), type: string }

  - name: projecten
    label: Werk (projecten)
    type: file
    path: _data/projecten.yml
    list: true
    fields:
      - { name: slug, label: "Korte code (niet wijzigen: bepaalt de link van de pagina)", type: string }
      - { name: organisatie, label: Organisatie, type: string }
      - { name: soort, label: "Soort (bijv. Digitaal bureau, leverancierszijde)", type: string }
      - { name: rol, label: Jouw rol, type: string }
      - { name: kaart_titel, label: Titel op het werkblok, type: string }
      - { name: kaart_tekst, label: Korte tekst op het werkblok, type: text }
      - { name: intro, label: Introductie bovenaan de projectpagina, type: text }
      - { name: tekst, label: "Tekst projectpagina (lege regel = nieuwe alinea)", type: text }
      - { name: lijst_titel, label: "Kop boven de opsomming (bijv. Wat ik deed)", type: string }
      - { name: lijst, label: Opsomming, type: string, list: true }
      - name: klanten
        label: Klanten met omschrijving
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.naam}" } }
        fields:
          - { name: naam, label: Naam, type: string }
          - { name: omschrijving, label: Omschrijving, type: text }
      - { name: tags, label: Labels, type: string, list: true }
      - name: feiten
        label: Vakje met feiten (rechts)
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: waarde, label: Waarde, type: string }

  - name: organisaties
    label: Logo-carrousel
    type: file
    path: _data/organisaties.yml
    list: true
    fields:
      - { name: naam, label: Naam, type: string }
      - { name: label, label: "Label (bijv. Klant via IO)", type: string }
      - { name: logo, label: "Logo (leeg = naam als tekst)", type: image }

  - name: aanbevelingen
    label: Aanbevelingen
    type: file
    path: _data/aanbevelingen.yml
    list: true
    fields:
      - { name: naam, label: Naam, type: string }
      - { name: omschrijving, label: "Organisatie, rol en jaar", type: string }
      - { name: tekst, label: Aanbeveling, type: text }
      - { name: soort, label: Soort, type: select, options: { values: [Klant of collega, Student] } }
      - { name: project, label: Tonen op projectpagina, type: select, options: { values: [geen, sacha-manfield, io, indicia, fontys] } }
      - { name: breed, label: Breed tonen (voor lange aanbevelingen), type: boolean }

  - name: loopbaan
    label: Loopbaan, opleiding en certificaten
    type: file
    path: _data/loopbaan.yml
    fields:
      - { name: kop, label: Grote kop, type: string }
      - { name: intro, label: Introductie, type: text }
      - name: banen
        label: Banen (nieuwste bovenaan)
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.functie}" } }
        fields:
          - { name: waar, label: Waar, type: string }
          - { name: functie, label: Functie, type: string }
          - { name: tekst, label: Omschrijving, type: text }
          - { name: project, label: Link naar projectpagina, type: select, options: { values: [geen, sacha-manfield, io, indicia, fontys] } }
          - { name: huidig, label: Huidige baan, type: boolean }
      - name: opleidingen
        label: Opleidingen
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.titel}" } }
        fields:
          - { name: titel, label: Opleiding, type: string }
          - { name: instelling, label: Instelling, type: string }
          - { name: periode, label: Periode, type: string }
      - name: certificaten
        label: Certificaten (nieuwste bovenaan)
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.titel}" } }
        fields:
          - { name: titel, label: Certificaat, type: string }
          - { name: instelling, label: Instelling, type: string }
          - { name: datum, label: Datum, type: string }

  - name: paginas
    label: Koppen van Werk, Aanbevelingen en Contact
    type: file
    path: _data/paginas.yml
    fields:
      - name: werk
        label: Pagina Werk
        type: object
        fields:
          - { name: kop, label: Kop, type: string }
          - { name: intro, label: Introductie, type: text }
      - name: aanbevelingen
        label: Pagina Aanbevelingen
        type: object
        fields:
          - { name: kop, label: Kop, type: string }
          - { name: intro, label: Introductie, type: text }
      - name: contact
        label: Pagina Contact
        type: object
        fields:
          - { name: kop, label: Kop, type: string }
          - { name: intro, label: Introductie, type: text }